<script>
  (function () {
    const SCRIPT_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';
    const form = document.getElementById('contact_form');
    const btn = document.getElementById('wv-submit');
    const status = document.getElementById('wv-status');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending...';
      status.textContent = '';

      try {
        // URL-encoded body bhejne se CORS preflight nahi hota
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams(new FormData(form))
        });
        form.reset();
        status.style.color = '#1a7f37';
        status.textContent = 'Thank you! We received your request and will get back to you shortly.';
      } catch (err) {
        status.style.color = '#c8102e';
        status.textContent = 'Something went wrong. Please call us at 651-497-9080.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Request';
      }
    });
  })();
</script>
